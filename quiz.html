    function renderQuestions() {
        const filter = document.getElementById('topicFilter').value;
        const container = document.getElementById('quiz-container');
        container.innerHTML = ''; // Limpa as antigas
        
        // Filtra pelo select
        let filteredQuestions = questionsList;
        if (filter !== 'all') {
            filteredQuestions = questionsList.filter(q => q.cat === filter);
        }
        
        filteredQuestions.forEach((q, index) => {
            const card = document.createElement('div');
            card.className = 'card mb-4';
            
            // Atribui uma cor baseada no tema
            let badgeClass = 'bg-primary';
            if (q.cat === 'Git' || q.cat === 'GitHub') badgeClass = 'bg-secondary';
            if (q.cat === 'POO') badgeClass = 'bg-info text-dark';
            
            let html = `
                <div class="card-header bg-primary d-flex justify-content-between align-items-center">
                    <span>Questão ${index + 1}</span>
                    <span class="badge ${badgeClass} fs-6">${q.cat}</span>
                </div>
                <div class="card-body">
                    <p class="question-text fw-bold mb-4">${q.q}</p>
                    <div class="options-container">
            `;
            
            q.options.forEach((opt, optIndex) => {
                const uniqueId = `q${index}_opt${optIndex}`;
                html += `
                    <label class="option-label" for="${uniqueId}">
                        <input class="form-check-input me-2" type="radio" name="question_${index}" id="${uniqueId}" value="${opt.correct}" data-rat="${opt.rat}">
                        ${opt.text}
                    </label>
                `;
            });
            
            html += `
                    </div>
                    <div class="rationale" id="rat_${index}"></div>
                </div>
            `;
            
            card.innerHTML = html;
            container.appendChild(card);
        });
        
        // Atualiza a barra de contagem e esconde o resultado se tiver filtrado
        document.getElementById('total-score').innerText = filteredQuestions.length;
        document.getElementById('final-result').classList.add('d-none');
    }

    function checkAllAnswers() {
        const container = document.getElementById('quiz-container');
        const cards = container.querySelectorAll('.card');
        let score = 0;
        let totalRendered = cards.length;
        
        cards.forEach((card, index) => {
            const selected = card.querySelector(`input[name="question_${index}"]:checked`);
            const rationaleBox = card.querySelector(`#rat_${index}`);
            rationaleBox.style.display = 'block';
            
            // Limpeza visual
            card.querySelectorAll('.option-label').forEach(lbl => lbl.classList.remove('correct-answer', 'incorrect-answer'));
            card.classList.remove('border', 'border-warning', 'border-success', 'border-danger');
            
            if (selected) {
                const isCorrect = selected.value === "true";
                const ratText = selected.getAttribute('data-rat');
                
                if (isCorrect) {
                    score++;
                    selected.parentElement.classList.add('correct-answer');
                    rationaleBox.innerHTML = `<strong>Correto!</strong> ${ratText}`;
                    rationaleBox.style.borderLeftColor = '#198754';
                    card.classList.add('border', 'border-success');
                } else {
                    selected.parentElement.classList.add('incorrect-answer');
                    const correctInput = card.querySelector(`input[value="true"]`);
                    if(correctInput) correctInput.parentElement.classList.add('correct-answer');
                    
                    rationaleBox.innerHTML = `<strong>Incorreto!</strong> ${ratText} <br><br><em>Justificativa da certa: ${correctInput ? correctInput.getAttribute('data-rat') : ''}</em>`;
                    rationaleBox.style.borderLeftColor = '#dc3545';
                    card.classList.add('border', 'border-danger');
                }
            } else {
                const correctInput = card.querySelector(`input[value="true"]`);
                if(correctInput) correctInput.parentElement.classList.add('correct-answer');
                rationaleBox.innerHTML = `<strong>Não respondida.</strong> Leia a justificativa: ${correctInput ? correctInput.getAttribute('data-rat') : ''}`;
                card.classList.add('border', 'border-warning');
            }
        });

        // Contabiliza score flutuante
        document.getElementById('current-score').innerText = score;

        // Exibe bloco final de resultado
        const resultDiv = document.getElementById('final-result');
        const percent = Math.round((score / totalRendered) * 100) || 0;
        
        resultDiv.classList.remove('d-none');
        document.getElementById('score-percent').innerText = `${percent}%`;
        document.getElementById('score-text').innerText = `Você acertou ${score} de um total de ${totalRendered} questões exibidas.`;
        
        if(percent >= 80) document.getElementById('score-percent').className = "display-1 fw-bold mb-3 text-success";
        else if(percent >= 50) document.getElementById('score-percent').className = "display-1 fw-bold mb-3 text-warning";
        else document.getElementById('score-percent').className = "display-1 fw-bold mb-3 text-danger";
        
        resultDiv.scrollIntoView({ behavior: 'smooth' });
    }

    // Ao iniciar a tela
    window.onload = function() {
        renderQuestions();
    }
</script>
